---
version: 2
updates:
  - package-ecosystem: "github-actions"
    directories:
      - "/"              # Catches .github/workflows and root action.yml
      - "/*"             # Catches /comment-pr, /dispatcher, /pre-commit, /update-check
      - "/terraform/*"   # Catches /terraform/deps
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 5
    groups:
      actions-dependency-updates:
        applies-to: version-updates
        patterns:
          - "*"

  - package-ecosystem: "pre-commit"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 5
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "pre-commit"
