name: pre-commit
description: Run pre-commit

inputs:
  python-version:
    description: 'Python version to use'
    required: false
    type: string
    default: '3.x'
  pre-commit-version:
    description: 'Pre-commit version to use'
    required: false
    type: string
    default: 'latest'
  skip-hooks:
    description: 'Comma-separated list of hooks to skip'
    required: false
    type: string
    default: 'conventional-branch-name'
  hook-stages:
    description: 'Space-separated pre-commit hook stages (e.g. "pre-commit pre-push"). Empty runs the default stage.'
    required: false
    type: string
    default: ''

runs:
  using: composite
  steps:
    - name: Setup Python
      uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
      with:
        python-version: ${{ inputs.python-version }}

    - name: Install pre-commit
      shell: bash
      run: |
        echo "Install pre-commit"
        package_spec="pre-commit"
        version="${{ inputs.pre-commit-version || 'latest' }}"
        [ "$version" != "latest" ] && package_spec+="==$version"
        pip install \
          -q \
          "$package_spec"

    - name: Run pre-commit on all files
      env:
        SKIP: ${{ inputs.skip-hooks }}
        HOOK_STAGES: ${{ inputs.hook-stages }}
      shell: bash
      run: |
        set -e
        read -r -a stages <<< "$HOOK_STAGES"
        if [ "${#stages[@]}" -eq 0 ]; then
          pre-commit run --color always --show-diff-on-failure --all-files
        else
          args=()
          for stage in "${stages[@]}"; do
            args+=("--hook-stage" "$stage")
          done
          pre-commit run --color always --show-diff-on-failure --all-files "${args[@]}"
        fi
